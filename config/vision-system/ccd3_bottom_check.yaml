# =============================================================================
# CCD#3 - Bottom Side Inspection Station
# AOI System for TI Package Inspection
# Station: BOTTOM_CHECK
# Last calibrated: 2025-09-12
# =============================================================================

station_id: CCD3_BOTTOM
description: "Bottom-up inspection for package underside defects, epoxy, and edge staining"

camera:
  model: MV-GE501GC
  interface: GigE Vision
  sensor_type: CMOS
  sensor_size_inch: 2/3
  pixel_size_um: 3.45
  max_resolution: [2448, 2048]
  bit_depth: 12
  color_mode: mono

lens:
  model: WWK03-110-230
  focal_length_mm: 110
  magnification: 0.3x
  aperture_range: [f/2.8, f/16]
  mount: C-mount

light_source:
  model: DN-COS60-W
  type: coaxial
  wavelength_nm: 6500  # white LED, 6500K color temperature
  diameter_mm: 60
  driver: constant_current
  controller_channel: 3

optical_parameters:
  resolution_mm_per_pixel: 0.0115
  fov_mm: [28, 24]
  working_distance_mm: 110
  working_distance_tolerance_mm: 2
  depth_of_field_mm: 1.2

mounting:
  orientation: bottom_up
  note: "Bottom-up capture; camera faces upward through transparent fixture"

environment:
  enclosure_required: true
  enclosure_type: dark_chamber
  purpose: "Prevent ambient light interference on bottom-up coaxial illumination"
  max_ambient_lux: 5
  enclosure_material: anodized_aluminum
  light_seal: labyrinth_baffle
  interlock: magnetic_reed_switch

acquisition:
  exposure_us: 900
  gain_db: 2.5
  trigger_mode: hardware
  trigger_source: line0
  trigger_edge: rising
  frame_rate_max_fps: 23
  pixel_format: Mono8
  roi:
    x: 0
    y: 0
    width: 2448
    height: 2048

image_preprocessing:
  flat_field_correction: true
  flat_field_ref: "calibration/ccd3_flatfield_20250912.tiff"
  background_subtraction: true
  background_ref: "calibration/ccd3_background_20250912.tiff"
  noise_reduction: gaussian
  noise_kernel_size: 3
  contrast_enhancement: clahe
  clahe_clip_limit: 2.0
  clahe_tile_size: [8, 8]

defects_detected:
  # spec V1.4 slide 9: bottom side check + misalignment (slides 32, 33, 36)
  - crack
  - broken
  - misalignment
  - electrical_contamination
  - non_electrical_contamination
  - dyeing_contamination

# Keys mirror aoi::DetectionParams / LocatorParams, production scale.
inspection_thresholds:
  locator:
    min_disc_radius_px: 300
    min_otsu_thresh: 30
    disc_fg_thresh: 40                  # amber epoxy and holes stay inside the disc
    notch_width_deg: 7.0
    notch_depth_px: 36
    fit_inlier_ratio: 0.03
    interior_margin_px: 60
  mm_per_px_ccd123: 0.0115
  fixture_center_ccd3: [1224, 1024]     # calibrated per station
  misalign_max_offset_mm: 0.15
  epoxy_region:                         # structure mask: the bottom-side epoxy "banana"
    epoxy_hue_low: 8
    epoxy_hue_high: 30
    epoxy_sat_min: 50
  crack:
    crack_blackhat_kernel_px: 41
    crack_blackhat_thresh: 25
    crack_aspect_min: 4.0
    crack_min_length_px: 90
    severity: critical
  broken:
    broken_depth_px: 20
    severity: critical
  contamination:
    contam_area_min_px: 300
    dyeing_sat_min: 70
    electrical_dark_max: 120
    electrical_texture_min: 20.0
