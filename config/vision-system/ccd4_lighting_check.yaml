# =============================================================================
# CCD#4 - Inner / Lighting Functional Check Station
# AOI System for TI Package Inspection
# Station: LIGHTING_CHECK
# Last calibrated: 2025-09-14
# =============================================================================

station_id: CCD4_LIGHTING
description: "Functional light-leakage and inner inspection using telecentric optics in sealed dark chamber"

camera:
  model: MV-GE2000C-T1P-C4
  interface: GigE Vision
  sensor_type: CMOS
  sensor_size_inch: 1
  pixel_size_um: 3.69
  max_resolution: [5496, 3672]
  bit_depth: 12
  color_mode: color  # color required for stain wavelength discrimination

lens:
  model: DTCM110-48
  type: telecentric
  magnification: 0.535x
  telecentricity_deg: 0.05
  working_distance_mm: 110
  na: 0.04
  mount: C-mount
  note: "Telecentric lens eliminates perspective distortion for accurate dimensional measurement"

light_source:
  model: DN-HSP25-W
  type: hyper_spot_light
  wavelength_nm: 6500  # white LED
  beam_diameter_mm: 25
  luminous_intensity_cd: 45000
  driver: strobe
  controller_channel: 4
  note: "High-intensity directional spot for penetrating sealed package cavity"

optical_parameters:
  resolution_mm_per_pixel: 0.0069
  fov_mm: [37.9, 25.3]
  working_distance_mm: 140
  working_distance_tolerance_mm: 3
  depth_of_field_mm: 0.8

chamber_design:
  type: closed_chamber
  substrate: sapphire_glass
  substrate_thickness_mm: 1.0
  substrate_transmittance_pct: 92
  cover: glass_cover
  cover_thickness_mm: 2.0
  seal: mechanical_shade
  seal_actuator: pneumatic
  seal_close_time_ms: 50
  purpose: functional_light_leakage_test
  max_ambient_lux: 0.1
  internal_surface_finish: matte_black_anodized
  interlock: optical_sensor

test_sequence:
  # The DUT is powered to activate internal LEDs, then imaged in total darkness
  steps:
    - action: close_shade
      timeout_ms: 200
    - action: verify_seal
      method: ambient_light_check
      threshold_lux: 0.1
    - action: power_dut
      voltage_v: 3.3
      current_limit_ma: 100
      settle_time_ms: 50
    - action: capture_dark_frame
      exposure_us: 5000
      note: "Reference frame with DUT off"
    - action: activate_dut_leds
      channel: all
    - action: capture_lit_frame
      exposure_us: 5000
    - action: power_off_dut
    - action: open_shade

acquisition:
  exposure_us: 5000
  gain_db: 4.0
  trigger_mode: software
  pixel_format: BayerRG8
  roi:
    x: 500
    y: 300
    width: 4496
    height: 3072

image_preprocessing:
  dark_frame_subtraction: true
  demosaic_method: bilinear
  white_balance: auto
  noise_reduction: bilateral
  bilateral_sigma_color: 50
  bilateral_sigma_space: 5

defects_detected:
  # spec V1.4 slide 8 ("Inner Staining Residue" sub-table) and slide 45
  - lighting_check
  - staining_on_edge
  - yellow_glass_cement
  - misalignment                        # disc centre vs the nest ring (slide 45)

thickness_classes: [amber, green, blue] # slide 31: thick samples look green or blue; reported only

# Keys mirror aoi::LightingParams (src/vision/LightingCheck.h), production scale
# (5472 x 3648, 0.0069 mm/px).
inspection_thresholds:
  baseline_mode: ring_percentile        # per-radius percentile of the unwrapped annulus (only mode implemented)
  baseline_percentile: 0.75             # survives up to ~75 % dark structure per ring (slide 30)
  inner_zone_ratio: 0.40
  outer_zone_ratio: 0.98
  edge_band_ratio: 0.85
  unwrap_w: 2880
  unwrap_h: 320
  lighting_check:
    leak_residual_min: 45
    leak_area_min_px: 320
    blob_aspect_max: 4.0
    severity: critical
  staining_on_edge:
    stain_residual_min: 45
    stain_area_min_px: 480
    stain_area_max_px: 12000
    severity: minor
  yellow_glass_cement:
    cement_hue_low: 20
    cement_hue_high: 40
    cement_sat_delta: 40
    cement_val_delta: 30
    cement_area_min_px: 480
    severity: minor
  misalignment:
    nest_ring_enabled: true
    nest_val_min: 25
    mm_per_px: 0.0069
    misalign_max_offset_mm: 0.15
    severity: critical
  min_lit_radius_px: 400
  min_otsu_thresh: 30
